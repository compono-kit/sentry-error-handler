services:
  sentry-error-handler_composer:
    build:
      dockerfile: Dockerfile
      context: .docker/php
    container_name: sentry-error-handler_composer
    restart: "no"
    working_dir: /app
    volumes:
      - ./:/app
      - ../SentryClient:/SentryClient:ro
networks:
  default:
    external: true
    name: shared-network
